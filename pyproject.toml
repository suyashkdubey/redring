[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "redring"
version = "0.2.0"
description = "Evidence-driven AI-assisted development environment diagnostics."
requires-python = ">=3.12"
license = {text = "MIT"}

authors = [
    {name = "Suyash Kumar Dubey"}
]

keywords = [
    "diagnostics",
    "developer-tools",
    "python",
    "cli",
    "textual",
    "environment"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "rich>=15.0.0",
    "textual>=5.0.0",
    "typer>=0.27.0",
]

[project.urls]
Homepage = "https://redring.pages.dev"
Repository = "https://github.com/suyashxdev/redring"
Issues = "https://github.com/suyashxdev/redring/issues"

[project.scripts]
redring = "redring.cli.main:app"
